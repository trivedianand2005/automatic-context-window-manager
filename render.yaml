# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the React site, the FastAPI backend, the Streamlit backup UI and a Postgres
# database (user accounts + saved context packages).
#
# NOTE: Render's free Postgres expires 30 days after creation (14-day grace period, then
# deleted). To keep data longer, upgrade the plan or point DATABASE_URL at another
# Postgres provider; no code changes are needed.
databases:
  - name: acwm-db
    plan: free
    databaseName: acwm
    user: acwm

services:
  - type: web
    name: acwm-ui
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      streamlit run app/streamlit_app.py
      --server.port $PORT --server.address 0.0.0.0
      --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: ACWM_TINYFISH_ENABLED
        value: "false"
      - key: TINYFISH_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: acwm-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # Documentation research: uses the labelled offline mock until a key is added.
      - key: ACWM_TINYFISH_ENABLED
        value: "true"
      # Secret: add the value in the Render dashboard (acwm-api -> Environment).
      - key: TINYFISH_API_KEY
        sync: false
      # Accounts: every visitor must log in; data lives in the acwm-db Postgres database.
      - key: ACWM_REQUIRE_AUTH
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: acwm-db
          property: connectionString
      - key: ACWM_JWT_SECRET
        generateValue: true
      - key: ACWM_FRONTEND_URL
        value: https://acwm-web.onrender.com
      - key: ACWM_PUBLIC_API_URL
        value: https://acwm-api.onrender.com
      # Optional "Login with GitHub": values from your GitHub OAuth app.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  # React frontend (static site, free). Calls the acwm-api service above.
  - type: web
    name: acwm-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: VITE_API_URL
        value: https://acwm-api.onrender.com
