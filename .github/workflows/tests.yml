name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-optional.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Sample repository tests
        working-directory: examples/sample_fastapi_repo
        run: python -m pytest -p no:cacheprovider
      - name: Demo smoke run
        run: python scripts/run_demo.py --out demo_output
